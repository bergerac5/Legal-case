<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REG OTP Verification</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 600px;
        margin: 30px auto;
        background-color: #ffffff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .header {
        background-color: #e50914;
        color: #ffffff;
        text-align: center;
        padding: 30px 20px;
      }

      .header img {
        width: 100px;
        margin-bottom: 10px;
      }

      .header h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 1px;
      }

      .content {
        padding: 30px 40px;
        color: #333333;
      }

      .content p {
        line-height: 1.6;
        font-size: 16px;
      }

      .otp {
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        color: #e50914;
        margin: 20px 0;
        letter-spacing: 2px;
      }

      .note {
        margin-top: 30px;
        font-size: 14px;
        color: #777;
        text-align: center;
      }

      .footer {
        background-color: #111111;
        color: #ffffff;
        text-align: center;
        padding: 15px;
        font-size: 12px;
      }

      @media only screen and (max-width: 600px) {
        .content {
          padding: 20px;
        }

        .otp {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img
          src="https://res.cloudinary.com/dya7uhzid/image/upload/v1744893069/logo_qfddll.png"
          alt="REG Logo"
        />
        <h1>OTP Verification</h1>
      </div>
      <div class="content">
        <p>Hello,</p>
        <p>
          Please use the following One-Time Password (OTP) to complete your
          verification process:
        </p>
        <div class="otp">{{OTP}}</div>
        <p>This OTP is valid for <strong>{{validMinutes}} minutes</strong>.</p>
        <p>If you did not request this code, please ignore this message.</p>
        <p>Best regards,<br />REG Team</p>
      </div>
      <div class="footer">&copy; {{year}} REG. All rights reserved.</div>
    </div>
  </body>
</html>
